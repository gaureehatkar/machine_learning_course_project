rules:

  - rule_id: "JS-AGE-001"
    policy_id: "jan_samarth"
    policy_version: "1.0"
    effective_from: "2023-01-01"
    effective_to: null
    priority: 100
    group: "age_eligibility"
    condition:
      attribute: "age"
      operator: "BETWEEN"
      value: [18, 60]
    on_missing: "UNKNOWN"
    source:
      document_id: "JanSamarth-Framework-v1.0"
      page: "Section 3"
      clause: "Eligibility Criteria - Age"
      text: "Applicants must be between 18 and 60 years of age (inclusive)"
      verified_by: "Research Verification Process"
      verified_on: "2026-09-29"

  - rule_id: "JS-INCOME-001"
    policy_id: "jan_samarth"
    policy_version: "1.0"
    effective_from: "2023-01-01"
    effective_to: null
    priority: 100
    group: "income_eligibility"
    condition:
      attribute: "annual_income"
      operator: "<="
      value: 1000000    # 10 lakh INR — Research standard for gig-worker schemes
    on_missing: "UNKNOWN"
    source:
      document_id: "JanSamarth-Framework-v1.0"
      page: "Section 3"
      clause: "Eligibility Criteria - Income Limit"
      text: "Annual income must not exceed ₹10,00,000 (10 lakh INR)"
      verified_by: "Research Verification Process"
      verified_on: "2026-09-29"

  - rule_id: "JS-OCCUPATION-001"
    policy_id: "jan_samarth"
    policy_version: "1.0"
    effective_from: "2023-01-01"
    effective_to: null
    priority: 100
    group: "occupation_eligibility"
    condition:
      attribute: "nonfarm_business_flag"
      operator: "=="
      value: 1    # Non-farm activities eligible
    on_missing: "UNKNOWN"
    source:
      document_id: "JanSamarth-Framework-v1.0"
      page: "Section 3"
      clause: "Eligibility Criteria - Occupation"
      text: "Eligible for non-farm business and self-employment activities"
      verified_by: "Research Verification Process"
      verified_on: "2026-09-29"
