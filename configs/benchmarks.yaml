# Benchmark model configurations for Phases 2 and 3
# All parameters must be set here — no hardcoding in scripts.

lightgbm:
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  num_leaves: 63
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: -1
  verbose: -1

catboost:
  iterations: 300
  learning_rate: 0.05
  depth: 6
  random_state: 42
  verbose: 0
  allow_writing_files: false

woe_logreg:
  # optbinning BinningProcess
  max_n_bins: 10
  min_bin_size: 0.05
  # Logistic Regression after WoE transform
  C: 1.0
  solver: lbfgs
  max_iter: 1000
  random_state: 42

# Review/abstention baselines (Phase 3)
review_baselines:
  # Conformal prediction: split-conformal on validation
  conformal_alpha: 0.10       # target coverage = 1 - alpha
  # Cost model (single C_R used across both budgets)
  cost_fn: 1.0                # cost per approved defaulter
  cost_fp: 1.0                # cost per declined good applicant
  cost_review_base: 0.10      # C_R for review
  cost_fn_ratios: [1, 3, 5]   # sensitivity: C_FN / C_FP ratios
